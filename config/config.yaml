# ufc-predictor configuration
#
# Single source of truth for seeds, paths, date windows, and hyperparameters.
# CLAUDE.md non-negotiable: "All randomness takes a seed. Same seed -> same numbers.
# Seeds live in config, not scattered literals." Nothing in src/ may hardcode a seed.

# ---------------------------------------------------------------------------
# Determinism
# ---------------------------------------------------------------------------
seed: 42

# ---------------------------------------------------------------------------
# Paths (relative to the repo root)
# ---------------------------------------------------------------------------
paths:
  raw_dir: data/raw
  processed_dir: data/processed
  reports_dir: reports
  # Dated snapshot directories. Bumping these is an explicit, reviewable change.
  ufcstats_snapshot: data/raw/ufcstats_snapshot_2026-10-09
  odds_snapshot: data/raw/odds_snapshot_2026-10-09
  aliases: src/ufc_predictor/ingest/aliases.csv

# ---------------------------------------------------------------------------
# Evaluation windows
#
# dev_window  : the ONLY period hyperparameters may be tuned against.
# eval_window : held-out walk-forward period. Never touched during development.
#
# Odds coverage runs 2010-03-21 .. 2026-03-28, so fights after that are unpriced
# and excluded from market comparison (documented in the README).
# ---------------------------------------------------------------------------
windows:
  dev_start: "2010-01-01"
  dev_end: "2015-12-31"
  eval_start: "2016-01-01"
  eval_end: "2026-10-03"
  # Phase 8 (2026-10-13): the eval window is CLOSED; no further eval runs. Model changes
  # are selected on 2010-2014 and confirmed exactly once on 2015
  # (src/ufc_predictor/experiments/protocol.py enforces both).
  selection_end: "2014-12-31"
  confirmation_start: "2015-01-01"
  confirmation_end: "2015-12-31"

# ---------------------------------------------------------------------------
# Ingest / joining
#
# A wrong fighter pairing is worse than a dropped row: a mispaired fight attaches
# one fighter's odds to another's result, which corrupts the market baseline silently.
# So matching is deliberately conservative and every non-exact decision is logged.
# ---------------------------------------------------------------------------
ingest:
  # Fuzzy name matching is a last resort, after exact and alias-table matching.
  # Both fighters must clear this similarity, on the same event date.
  fuzzy_threshold: 0.92
  # The best candidate must beat the runner-up by this margin, or the match is
  # ambiguous and the row is dropped rather than guessed.
  fuzzy_ambiguity_margin: 0.05
  # Hard ceiling on the share of priced fights left unjoined. Exceeding it raises:
  # a silent drop in join quality would quietly shrink and bias the eval set.
  max_unmatched_share: 0.05
  # Fighters whose name maps to several UFCStats ids cannot be identified from this
  # snapshot. Merging two careers would corrupt point-in-time features, so their
  # bouts are dropped. This caps how many such drops are tolerated.
  max_ambiguous_share: 0.02
  # Sanity bounds on the bookmaker's overround (implied probabilities summing above 1).
  # A real two-sided market must price above 100%, so a non-positive overround is
  # arithmetically impossible and indicates corrupted prices (e.g. +176 / +275, a
  # notional 37% arbitrage). Typical UFC moneyline vig is 2-8%; the 99.9th percentile
  # in this snapshot is 21.6%, so anything above 25% is treated as corrupt too.
  # Such rows are dropped with a logged count rather than allowed to distort the
  # market baseline.
  min_overround_exclusive: 0.0
  max_overround: 0.25

# ---------------------------------------------------------------------------
# Features
# ---------------------------------------------------------------------------
features:
  rolling_windows: [3, 5]      # last-N-fight windows, plus career-to-date
  min_prior_fights: 1          # below this, rolling features stay NaN (never backfilled)
  recency_half_life_fights: 3  # "recency" family EWM half-life, in bouts; a priori, not searched

elo:
  initial_rating: 1500.0
  k_factor: 32.0
  scale: 400.0

glicko2:            # Glickman's recommended defaults, fixed a priori, not searched
  tau: 0.5
  initial_rating: 1500.0
  initial_rd: 350.0
  initial_vol: 0.06
  period_days: 30

# ---------------------------------------------------------------------------
# Models
# ---------------------------------------------------------------------------
# Selected by `uv run ufc-predictor tune` on 2026-10-12, using a chronological holdout
# INSIDE the dev window only (train 2,581 fights to 2014-03, validate 860 fights
# 2014-03..2015-12). No random cross-validation: random folds would let later fights
# inform the model predicting earlier ones.
#
# RE-TUNED after the scrape-time attribute leak was removed (reports/review.md,
# finding 1). The previous selection (depth 3, 7 leaves, lr 0.02, lambda 5.0; dev
# validation log loss 0.6147) was tuned on features where a blank reach meant "this
# fighter was later cut", so its objective rewarded the leak. Same 216-candidate grid,
# same tie rule. Without the leak the best dev validation log loss is 0.6775 (a coin
# flip scores 0.6931); the previous settings score 0.6825 on the same split. Two
# candidates were within 0.001 of the best, and the rule took the first of them.
#
# These are now FROZEN, and were committed and pushed before evaluation run 2 was
# scored. The walk-forward backtest reads them from here and never re-tunes.
lightgbm:
  n_estimators: 2000          # an upper bound; early stopping picks the real count (31 on the tuning split)
  learning_rate: 0.05
  num_leaves: 31
  max_depth: 6
  min_child_samples: 80
  subsample: 0.8
  subsample_freq: 1
  colsample_bytree: 0.7
  reg_alpha: 0.1
  reg_lambda: 1.0
  verbosity: -1

# Fitting regime for LightGBM, applied identically on every walk-forward fold.
lightgbm_fit:
  # Fraction of each training slice held back as a chronological tail, used for early
  # stopping and for fitting the isotonic calibrator.
  validation_fraction: 0.2
  early_stopping_rounds: 50
  # Isotonic calibration, fitted on the holdout tail only -- never on the trees' own
  # training rows (circular) and never on the evaluation period.
  calibrate: true
  # A fold whose validation tail would fall below this RAISES rather than fitting the
  # full n_estimators ceiling unvalidated and uncalibrated. At 300 the three earliest
  # dev folds silently took that path -- 2,000 trees with no early stopping -- and were
  # reported in the same column as properly validated folds. Paired with
  # min_train_fights below, every fold now gets a real holdout.
  min_validation_rows: 200
  # Bounds on the calibrated probability, added for evaluation run 3. Isotonic regression
  # is a step function, and a step holding only wins or only losses output exactly 0 or 1:
  # run 2 had 25 dev and 26 eval such predictions, and each miss cost ln(1e6) = 13.8 nats.
  # [0.01, 0.99] was fixed a priori as a loose, round bound, not searched. Dev-window
  # evidence only (2010-2015, 2,154 priced fights; `ufc-predictor diagnose` regenerates
  # it into reports/leakage_diagnostics.json): the vig-free closing line never left
  # [0.070, 0.930], and favourites priced at 0.85 or more still lost 8.3% of 72 bouts.
  # So the bound sits far outside anything the line or the outcomes support, removes only
  # literal certainty, and caps a miss at ln(100) = 4.6 nats. Hyperparameters are
  # unchanged: tuning fits without calibration, so the bound cannot affect it.
  calibration_bounds: [0.01, 0.99]

# ---------------------------------------------------------------------------
# Backtest
# ---------------------------------------------------------------------------
backtest:
  # Retrain cadence in events. The per-fold training cutoff is asserted strictly
  # before the predicted event regardless of this value (tests/test_leakage.py).
  retrain_every_n_events: 10
  # Must be large enough that validation_fraction yields at least min_validation_rows
  # (1000 * 0.2 = 200), so no fold can end up fitting without a chronological holdout.
  min_train_fights: 1000
  bootstrap_resamples: 10000
  bootstrap_ci: 0.95

# ---------------------------------------------------------------------------
# BestFightOdds historical lines (Phase 8 closing-line-value analysis)
#
# Crawled once from fighter pages, cached, and committed as a dated snapshot; nothing on
# the graded path touches the network. robots.txt (2026-10-13): "User-agent: * / Allow: /",
# no crawl delay. The window is the development window only.
# ---------------------------------------------------------------------------
bfo:
  base_url: https://www.bestfightodds.com
  user_agent: "ufc-predictor research bot (github.com/AnthonyOlakangil/fightline-ml)"
  delay_s: 5.0
  cache_dir: data/cache/bfo
  window_start: "2010-01-01"
  window_end: "2015-12-31"
  snapshot_dir: data/raw/bfo_snapshot_2026-10-13

# ---------------------------------------------------------------------------
# Forward test (Phase 8): predictions committed before each card, scored after it.
# Research only: a market comparison is recorded, never a stake.
# ---------------------------------------------------------------------------
forward:
  results_dir: data/raw/espn_results      # ESPN results after the UFCStats snapshot (committed)
  reports_dir: reports/forward            # predictions, prices, settlements, ledger.json
  cache_dir: data/cache/forward           # raw responses of each run (git-ignored)
  delay_s: 1.0                            # between requests to ESPN / Kalshi / BestFightOdds
  min_lead_hours: 24                      # predictions must be committed this long before the card
  predict_window_hours: 72                # earliest a card is predicted
  close_window_hours: 3                   # pre-start price snapshot (a fallback; see kalshi.py)
  settle_after_hours: 36                  # settle even if ESPN still lists a bout as unfinished
  horizon_days: 10                        # how far ahead the schedule looks
  history_days: 21                        # how far back it looks for unsettled cards
  close_lookback_minutes: 120             # Kalshi candlesticks read before each segment start

# ---------------------------------------------------------------------------
# Simulation / parlay pricing (research backtest only - not betting advice)
# ---------------------------------------------------------------------------
sim:
  n_sims: 10000                # Monte Carlo draws per card
  kelly_fraction: 0.25         # fractional Kelly; full Kelly is far too aggressive here
  starting_bankroll: 1000.0
  max_parlay_legs: 3
  min_edge: 0.02               # a parlay must clear this modelled EV to be staked
  # Hard cap on any single stake as a fraction of the current bankroll. Kelly on a
  # long-shot parlay can recommend an enormous fraction when the modelled edge is
  # large and wrong; the cap bounds how much a single mispriced parlay can cost.
  max_bet_fraction: 0.02
  # Bankroll is counted as ruined if it ever falls to this fraction of its start.
  ruin_threshold: 0.20
  # How many top-EV parlays per card enter the predicted-EV-vs-realised-ROI table.
  top_n_per_card: 3
  # Resamples for the event-level bankroll bootstrap.
  bankroll_bootstrap_resamples: 2000
