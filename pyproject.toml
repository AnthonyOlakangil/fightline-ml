[project]
name = "ufc-predictor"
version = "0.1.0"
description = "A reproducible, leak-free UFC fight-outcome model evaluated against the vig-free betting market."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Anthony Olakangil", email = "a.olakangil26@gmail.com" }]

dependencies = [
    "pandas>=2.2",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "matplotlib>=3.8",
    "typer>=0.12",
    "pyyaml>=6.0",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "streamlit>=1.37",
]

[project.optional-dependencies]
# Isolated stretch module (Phase S1). The core suite must pass without this installed.
bayes = ["numpyro>=0.15", "jax>=0.4.30"]

[project.scripts]
ufc-predictor = "ufc_predictor.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ufc_predictor"]

# ----------------------------------------------------------------------------
# ruff
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # comprehensions
    "SIM", # simplify
    "PD",  # pandas-vet
    "NPY", # numpy
    "RUF",
]
ignore = [
    "E501",    # line length handled by the formatter
    "B008",    # Typer uses function calls in argument defaults by design
]

[tool.ruff.lint.per-file-ignores]
# The leakage tests mutate single cells to prove the past does not move; `.at` is the
# correct idiom for that, and `.values` is what pandas' own hashing helper returns.
"tests/*" = ["B011", "PD008", "PD011"]

# ----------------------------------------------------------------------------
# pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "leakage: point-in-time correctness tests (must always pass)",
    "slow: excluded from the fast feedback loop",
    "network: requires network access; never on the graded path",
]
filterwarnings = [
    # pandas raises FutureWarning for silent behaviour changes in groupby/shift/rolling,
    # which is exactly where point-in-time feature bugs hide. Treat those as errors.
    "error::FutureWarning",
    # DeprecationWarning is left at default: third-party libraries (streamlit, jax)
    # emit these routinely and failing on them would make CI brittle for no safety gain.
]
