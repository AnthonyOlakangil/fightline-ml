name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: ruff + pytest (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the provenance test reads config/config.yaml at the commit the
          # eval ledger recorded, which a shallow clone would not contain.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies (locked)
        run: uv sync --all-groups --frozen

      - name: Confirm interpreter is 3.11
        run: |
          uv run python -c "import sys; v=sys.version_info; \
            assert (v.major, v.minor) == (3, 11), f'got {v.major}.{v.minor}'; \
            print(f'Python {v.major}.{v.minor}.{v.micro}')"

      - name: Lint
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .

      # Build the derived tables before testing. Without them the leakage fixtures skip,
      # which silently reduced the mandatory suite to 4 of 23 tests -- a leakage
      # regression would then have passed CI. The raw snapshot is committed, so this
      # needs no network.
      - name: Build data and features (offline)
        run: |
          uv run ufc-predictor data
          uv run ufc-predictor features

      # The graded path must never need the network: the raw snapshot is committed.
      # Any test that reaches out is marked `network` and excluded here.
      - name: Test (offline; leakage suite included)
        run: uv run pytest -m "not network" --cov=ufc_predictor --cov-report=term-missing

      # Deliberately strict on two counts: pytest exits 5 when nothing is collected, so
      # an emptied suite fails the build; and a *skipped* leakage test is not a passing
      # one, so any skip fails it too. Missing processed data previously reduced this
      # gate from 23 tests to 4 without failing, which is exactly the silent weakening
      # this step now catches.
      - name: Point-in-time correctness suite (must be non-empty, no skips)
        run: |
          set -o pipefail
          uv run pytest -m leakage -v --no-header | tee leak.log
          if grep -qE '[0-9]+ skipped' leak.log; then
            echo "::error::leakage tests were skipped - a skipped leakage test is not a passing one"
            exit 1
          fi
